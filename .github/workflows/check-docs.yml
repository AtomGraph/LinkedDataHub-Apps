name: Check Docs

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check-docs:
    name: Check documentation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Jena 6 requires Java 21; the runner defaults to 17
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: RDF syntax check
        uses: AtomGraph/RDF-syntax-check@v1.0.5
        with:
          jena-version: 6.1.0

      - name: Install Linux packages
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils

      # riot checks rdf:XMLLiteral well-formedness; canonical form is only
      # enforced up to Jena 4.7.0, so it is checked separately
      - name: XMLLiteral canonical form check
        run: ./check-xmlliterals.sh

      - name: Check links
        run: ./check-links.sh

  # A master push that passes the checks goes live: linkeddatahub.com's sync-dataspaces workflow
  # holds the deployment's credentials and maps the changed paths onto its dataspaces
  dispatch:
    name: Sync linkeddatahub.com
    needs: check-docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch the commit range
        env:
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }} # fine-grained, contents: write on AtomGraph/linkeddatahub.com only
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          gh api repos/AtomGraph/linkeddatahub.com/dispatches \
            -f event_type=apps-pushed \
            -f "client_payload[before]=$BEFORE" \
            -f "client_payload[after]=$AFTER"
