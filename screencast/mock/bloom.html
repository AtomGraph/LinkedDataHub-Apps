<!doctype html>
<html data-retro="m3" data-theme="dark" lang="en">
<meta charset="utf-8">
<title>the bloom</title>
<link rel="stylesheet" href="states/app.css">
<style>
  html, body { margin: 0; background: #0f131a; width: 1440px; height: 900px; overflow: hidden; }
  #stage { position: relative; width: 1440px; height: 900px; font-family: 'Geist', system-ui, sans-serif; color: #f3f6fc; }
  #stage * { pointer-events: none; }
  #graph { position: absolute; inset: 0; background: #000011; }
  #graph svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  /* the app's own chrome around its canvas, from the capture */
  #chrome { position: absolute; inset: 0; }
  #chrome .graph-3d-canvas { position: absolute; inset: 0; }
  #chrome .scene-container { display: none; }
  #chrome .graph-3d-show-panel { top: auto !important; bottom: 28px !important; left: 16px !important; }
  /* only the controls: the host and its wrappers paint nothing, the drawn graph shows through */
  #chrome .graph-3d-canvas, #chrome .graph-3d-canvas > div, #chrome .graph-3d-canvas > div > div { background: transparent !important; height: 100% !important; }
  /* the record page, arriving */
  #page { position: absolute; inset: 0; background: #0f131a; opacity: 0; transform-origin: 50% 50%; }
  #page .inner { padding: 72px 129px 0; }
  .caption { position: absolute; left: 96px; bottom: 64px; font: 500 40px 'Geist', system-ui, sans-serif; color: #f3f6fc; opacity: 0; letter-spacing: -.01em; }
  .caption i { font: 400 40px 'Instrument Serif', Georgia, serif; color: #98ccff; }
  .cursor { position: absolute; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 0 0 4px rgba(255,255,255,.25); transform: translate(-50%,-50%); opacity: 0; }
</style>
<script src="assets/d3-force.min.js"></script>
<div id="stage">
  <div id="graph"><svg viewBox="0 0 1440 900"></svg></div>
  <div id="chrome"></div>
  <div id="page"><div class="inner" id="record"></div></div>
  <div class="cursor" id="cur"></div>
  <div class="caption" id="cap"><i>one click,</i> another document</div>
</div>
<script type="module">
  import { ease, at, q, svgEl, template } from './lib.js';
  import { hueOf, layout, draw } from './graph.js';
  // ── data: an order and everything on it, then the customer's own document ──
  const W = 1440, H = 900;
  const order = { id: 'order', label: 'Order 10423', type: 'Order', big: true, r: 11 };
  const mk = (id, label, type, big = false, r = 6) => ({ id, label, type, big, r, hue: hueOf(type) });
  const doc1 = [order, mk('customer', 'Gourmet Lanchonetes', 'Corporation', true, 9), mk('rep', 'Suyama', 'Person', true, 8), mk('delivery', 'Delivery', 'ParcelDelivery'), mk('shipper', 'Federal Shipping', 'Corporation', true, 8), mk('address', 'Campinas', 'PostalAddress'), mk('shipment', 'Shipped 1997-02-24', 'DeliveryEvent'), mk('offer', 'Shipping', 'Offer'), ...Array.from({ length: 8 }, (_, i) => mk(`li${i}`, '', 'OrderItem')), ...Array.from({ length: 8 }, (_, i) => mk(`p${i}`, ['Pavlova', 'Chai', 'Ipoh Coffee', 'Tofu', 'Gnocchi', 'Konbu', 'Chocolade', 'Zaanse koeken'][i], 'Product', i < 3, 6))];
  order.hue = hueOf('Order');
  const links1 = [['order', 'customer'], ['order', 'rep'], ['order', 'delivery'], ['delivery', 'shipper'], ['delivery', 'address'], ['delivery', 'shipment'], ['order', 'offer'], ...Array.from({ length: 8 }, (_, i) => ['order', `li${i}`]), ...Array.from({ length: 8 }, (_, i) => [`li${i}`, `p${i}`])].map(([s, t]) => ({ source: s, target: t }));
  // the customer's document: its contact, address, employee, and six other orders
  const doc2 = [mk('c-contact', 'André Fonseca', 'Person', true, 7), mk('c-address', 'Av. Brasil 442', 'PostalAddress'), mk('c-phone', '(11) 555-9482', 'ContactPoint'), ...Array.from({ length: 6 }, (_, i) => mk(`o${i}`, ['10709', '10777', '10877', '10945', '11049', '11071'][i], 'Order', i < 2, 7))];
  const links2 = [['customer', 'c-contact'], ['customer', 'c-address'], ['customer', 'c-phone'], ...Array.from({ length: 6 }, (_, i) => ['customer', `o${i}`])].map(([s, t]) => ({ source: s, target: t, dist: 70 }));
  // layout: doc1 first, then doc2 with doc1 pinned so the bloom grows outward
  const n1 = doc1.map((n) => ({ ...n })); const l1 = links1.map((l) => ({ ...l }));
  layout(n1, l1, { w: W * 0.62, h: H, charge: -320, dist: 62 });
  const byId = Object.fromEntries(n1.map((n) => [n.id, n]));
  n1.forEach((n) => { n.fx = n.x; n.fy = n.y; });
  const cust = byId.customer;
  // the customer's own document fans out from the customer, away from the order —
  // choreographed, not simulated: a bloom reads as one when it opens like a hand
  const o = byId.order;
  const away = Math.atan2(cust.y - o.y, cust.x - o.x);
  const n2 = doc2.map((n, i) => { const k = doc2.length; const a = away + (i - (k - 1) / 2) * (Math.PI * 0.95 / (k - 1)); const d = 120 + (i % 2) * 34; return { ...n, x: cust.x + Math.cos(a) * d, y: cust.y + Math.sin(a) * d }; });
  const all = [...n1, ...n2]; const l2 = links2.map((l) => ({ ...l, source: cust, target: n2.find((n) => n.id === l.target) }));
  // fit everything into the stage with margins (the chrome sits at the corners)
  const xs = all.map((n) => n.x), ys = all.map((n) => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs), minY = Math.min(...ys), maxY = Math.max(...ys);
  const M = 140, sc = Math.min((W - 2 * M) / (maxX - minX), (H - 2 * M) / (maxY - minY), 1.7);
  const ox = (W - (maxX - minX) * sc) / 2 - minX * sc, oy = (H - (maxY - minY) * sc) / 2 - minY * sc;
  all.forEach((n) => { n.x = n.x * sc + ox; n.y = n.y * sc + oy; n.r = n.r * Math.min(1.3, sc); });
  const svg = q('#graph svg');
  const { L, N } = draw(svg, all, [...l1, ...l2]);
  const L1 = L.slice(0, l1.length), L2 = L.slice(l1.length);
  // the app's chrome and the record page
  q('#chrome').append(await template('graph-host'));
  q('#chrome .graph-3d-info-panel div').textContent = 'Click a node to see details';
  q('#record').innerHTML = `<div class="ldh-block-head ldh-res-head"><div class="ldh-res-text"><div class="ldh-res-titleline"><h2 class="ttl">Gourmet Lanchonetes</h2><span class="ac-tag">Corporation</span></div></div></div>
    <dl class="ldh-prop-form" style="margin-top:24px">${[['Company name', 'Gourmet Lanchonetes'], ['Contact point', 'André Fonseca'], ['Identifier', 'GOURL'], ['Employee', 'André Fonseca'], ['Title', 'Gourmet Lanchonetes']].map(([k, v]) => `<div class="ldh-prop-group"><dt class="label"><span class="pred">${k}</span></dt><dd class="ldh-prop-row"><div class="value">${v}</div></dd></div>`).join('')}</dl>
    <h2 style="margin-top:36px;font:600 22px Geist,system-ui,sans-serif">Orders from this customer <span class="ac-tag">View</span></h2>`;
  // ── timeline ────────────────────────────────────────────────────────────────
  const K = { nodesIn: [0.0, 1.2], linksIn: [0.4, 1.4], settle: [1.4, 2.0], cursorIn: [1.6, 2.2], dbl: [2.3, 2.6], bloomLinks: [2.6, 3.8], bloomNodes: [2.8, 4.4], hold: [4.4, 5.2], click: [5.2, 5.5], pageIn: [5.5, 6.3], cap: [3.0, 5.2], end: 8.0 };
  const cur = q('#cur');
  const maxD = Math.max(...n1.map((n) => Math.hypot(n.x - byId.order.x, n.y - byId.order.y)));
  window.render = (s) => {
    // doc1 appears: nodes by distance from the order, links after
    const o = byId.order;
    n1.forEach((n, i) => { const d = Math.hypot(n.x - o.x, n.y - o.y) / maxD; const t = ease(Math.max(0, Math.min(1, (at(s, K.nodesIn) - d * 0.6) / 0.4))); n.circle.setAttribute('r', n.r * t); if (n.text) n.text.setAttribute('opacity', String(t)); });
    L1.forEach((e, i) => { const t = ease(at(s, K.linksIn)); const l = l1[i]; e.setAttribute('x2', l.source.x + (l.target.x - l.source.x) * t); e.setAttribute('y2', l.source.y + (l.target.y - l.source.y) * t); });
    // cursor to the customer node, double-click
    const ci = ease(at(s, K.cursorIn)); cur.style.opacity = String(Math.min(ci, 1 - ease(at(s, [K.click[1], K.click[1] + 0.3]))));
    cur.style.left = `${cust.x + (1 - ci) * 260}px`; cur.style.top = `${cust.y + (1 - ci) * 180}px`;
    const db = at(s, K.dbl); const pulse = db > 0 && db < 1 ? 1 + 0.5 * Math.sin(db * Math.PI * 2) : 1; cur.style.transform = `translate(-50%,-50%) scale(${pulse})`;
    cust.circle.setAttribute('r', cust.r * (1 + 0.35 * (db > 0 && db < 1 ? Math.sin(db * Math.PI) : 0)));
    // the bloom: links draw outward from the customer, nodes arrive at their ends
    L2.forEach((e, i) => { const t = ease(Math.max(0, Math.min(1, (at(s, K.bloomLinks) - i * 0.05) / 0.6))); const l = l2[i]; e.setAttribute('x2', l.source.x + (l.target.x - l.source.x) * t); e.setAttribute('y2', l.source.y + (l.target.y - l.source.y) * t); e.setAttribute('stroke', t < 1 ? 'rgba(152,204,255,.9)' : 'rgba(255,255,255,.28)'); });
    n2.forEach((n, i) => { const t = ease(Math.max(0, Math.min(1, (at(s, K.bloomNodes) - i * 0.07) / 0.5))); n.circle.setAttribute('r', n.r * t); if (n.text) n.text.setAttribute('opacity', String(t)); });
    // info panel after the bloom
    const panel = q('#chrome .graph-3d-info-panel div'); if (at(s, K.hold) > 0) panel.innerHTML = '<b>Gourmet Lanchonetes</b><br><small>Corporation · customers/GOURL</small>';
    // click → the record page
    const pi = ease(at(s, K.pageIn)); q('#page').style.opacity = String(pi); q('#page').style.transform = `scale(${0.96 + 0.04 * pi}) translateY(${(1 - pi) * 30}px)`;
    const c = at(s, K.cap); q('#cap').style.opacity = String(ease(Math.min(1, c * 3)) * (1 - ease(Math.max(0, Math.min(1, (c - 0.75) * 4)))));
    return s < K.end;
  };
  window.duration = K.end; window.ready = true;
</script>
